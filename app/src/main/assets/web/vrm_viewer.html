<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JFindMe 3D Avatar Bridge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@1.0.9/lib/three-vrm.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, -2.5);
        camera.lookAt(0, 1.0, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 🧠 Dynamic Time-of-Day Shader Engine
        const dHour = new Date().getHours();
        let dlColor = 0xffffff, amColor = 0x888888;
        if (dHour >= 18 || dHour < 6) { 
            // Night Shader Mode: Cold blue hues
            dlColor = 0x5555AA; amColor = 0x222244; 
        } else if (dHour >= 16 || dHour <= 7) { 
            // Golden Hour Shading: Deep orange hues
            dlColor = 0xFF5522; amColor = 0x884422; 
        }

        const light = new THREE.DirectionalLight(dlColor);
        light.position.set(1, 1, -1).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(amColor));

        let currentVrm = null;
        let clock = new THREE.Clock();
        let activeAnim = "IDLE";

        window.loadModel = function(url) {
            if (currentVrm) { scene.remove(currentVrm.scene); }
            const loader = new THREE.GLTFLoader();
            loader.register((parser) => new THREE_VRM.VRMLoaderPlugin(parser));
            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; 
                currentVrm = vrm;
            });
        };

        window.playAnimation = function(anim) {
            activeAnim = anim;
        };

        // 🧠 Enterprise Engine: Modular Avatar System (Material Proxy)
        window.changeComponentColor = function(category, hexString) {
            if (!currentVrm) return;
            const newColor = new THREE.Color(hexString);
            
            currentVrm.scene.traverse((child) => {
                if (child.isMesh && child.material) {
                    let matName = child.material.name.toLowerCase();
                    // VRM standard naming fallbacks
                    if (category === "hair" && matName.includes("hair")) {
                        child.material.color.set(newColor);
                    } else if (category === "outfit" && (matName.includes("cloth") || matName.includes("top") || matName.includes("bottom") || matName.includes("shirt") || matName.includes("dress"))) {
                        child.material.color.set(newColor);
                    } else if (category === "shoes" && (matName.includes("shoe") || matName.includes("boot") || matName.includes("foot"))) {
                        child.material.color.set(newColor);
                    } else if (category === "body" && (matName.includes("skin") || matName.includes("body") || matName.includes("face"))) {
                        child.material.color.set(newColor);
                    }
                }
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            if (currentVrm) {
                currentVrm.update(clock.getDelta());
                const t = clock.getElapsedTime();
                if (currentVrm.humanoid) {
                    const armL = currentVrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    const armR = currentVrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    const legL = currentVrm.humanoid.getNormalizedBoneNode('leftUpperLeg');
                    const legR = currentVrm.humanoid.getNormalizedBoneNode('rightUpperLeg');
                    
                    if (activeAnim === "WALK" || activeAnim === "RUN") {
                        let speed = activeAnim === "WALK" ? 5 : 12;
                        if(armL && armR && legL && legR) {
                            armL.rotation.x = Math.sin(t * speed) * 0.5 + 1.2;
                            armR.rotation.x = -Math.sin(t * speed) * 0.5 + 1.2;
                            legL.rotation.x = -Math.sin(t * speed) * 0.5;
                            legR.rotation.x = Math.sin(t * speed) * 0.5;
                        }
                    } else if (activeAnim === "EMOTE") {
                        if(armL && armR) {
                            armL.rotation.z = Math.sin(t * 8) * 0.5 + 1.5;
                            armR.rotation.z = -Math.sin(t * 8) * 0.5 - 1.5;
                            armL.rotation.x = 0; armR.rotation.x = 0;
                        }
                    } else {
                        if(armL && armR && legL && legR) {
                            armL.rotation.set(1.2, 0, 0.2);
                            armR.rotation.set(1.2, 0, -0.2);
                            legL.rotation.set(0,0,0);
                            legR.rotation.set(0,0,0);
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
